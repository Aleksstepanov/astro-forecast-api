server {
  listen 80;
  server_name _;

  # Basic Auth (можно временно убрать, если бесит)
  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Frontend static (Vite/SPA)
  root /usr/share/nginx/html;
  index index.html;

  # Можно оставить health-check (опционально)
  location = /health {
    return 200 "OK\n";
    add_header Content-Type text/plain;
  }

  # SPA routing: отдаём index.html, если файла нет
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend API
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # На всякий случай: чтобы не буферизовать большие ответы (можно убрать)
    proxy_buffering off;
  }
}
