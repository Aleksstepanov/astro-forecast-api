server {
  listen 80;
  server_name _;

  # ---------- FRONT (SPA) ----------
  # Фронт должен быть смонтирован в контейнер nginx сюда:
  # /usr/share/nginx/html  (dist)
  root /usr/share/nginx/html;
  index index.html;

  # Basic Auth для UI
  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Health-check без пароля (удобно)
  location = /health {
    auth_basic off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---------- API ----------
  # ВАЖНО:
  # 1) auth_basic off — чтобы фронт мог ходить в API без ввода пароля в XHR/fetch
  # 2) proxy_pass БЕЗ слэша в конце, иначе nginx срежет /api и будет 404
  location /api/ {
    auth_basic off;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
  }
}
